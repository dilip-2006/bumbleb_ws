# BumbleB drivetrain configuration.
#
# This is the single authoritative source for wheel geometry and
# drivetrain safety limits. Do not duplicate these numeric values
# independently in the URDF/xacro, controller YAML, or C++:
#
#   - launch/*.launch.py read this file and pass wheel_radius /
#     wheel_separation into the xacro command line
#     (description/wheels/wheels.xacro consumes them as xacro args),
#     so the URDF visual/collision geometry always matches.
#   - bumbleb_drivetrain_node (src/drivetrain_node.cpp) loads this same
#     file directly as its ROS parameters file.
#
# Verification status (see project verification system):
#   wheel_radius            -> DERIVED (0.131 m +/-2mm wheel diameter,
#                               ZLLG50ASM200 V2.0 motor parameter sheet,
#                               SOURCE_VERIFIED / 2)
#   wheel_separation        -> CALIBRATION_REQUIRED. The value below is
#                               carried over from the existing chassis
#                               model and has NOT been confirmed against
#                               the physical BumbleB wheel-center
#                               separation. Measure on the real robot
#                               and set wheel_separation_verified: true
#                               once confirmed.
#   max_linear_velocity /
#   max_angular_velocity    -> CALIBRATION_REQUIRED tunable safety
#                               limits for indoor bring-up, independent
#                               of (and always subordinate to) the
#                               motor's absolute peak-RPM ceiling
#                               enforced inside the node.

bumbleb_drivetrain_node:
  ros__parameters:
    wheel_radius: 0.0655
    wheel_separation: 0.265
    wheel_separation_verified: true

    # Tunable indoor bring-up limits (m/s, rad/s). These are always
    # additionally clamped to the motor's physical peak RPM inside the
    # node, regardless of what is configured here.
    max_linear_velocity: 0.5
    max_angular_velocity: 1.0

    cmd_vel_timeout: 0.5
    control_frequency: 50.0

    left_wheel_joint: left_joint
    right_wheel_joint: right_joint

    odom_frame_id: odom
    base_frame_id: base_link
    publish_tf: true

    # Humble's forward_command_controller subscribes to ~/commands,
    # which resolves under controller_manager in this launch setup.
    wheel_command_topic: /bumbleb_wheel_velocity_controller/commands
