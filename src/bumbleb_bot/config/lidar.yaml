# RPLIDAR runtime parameters for BumbleB.
# Verify model-specific serial settings against the installed RPLIDAR.
rplidar_node:
  ros__parameters:
    # Stable udev link for the RPLIDAR CP2102 adapter.
    serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    serial_baudrate: 115200
    frame_id: lidar_link
    inverted: false
    angle_compensate: true
    scan_mode: Standard
